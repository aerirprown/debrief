[package]
name = "debrief-journal"
version = "0.1.0"
edition = "2021"
description = "Append-only gaming journal: device ids, sessions, freeform note revisions, memoir read"
license = "AGPL-3.0-only"
rust-version = "1.88"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
