[package]
name = "debrief-watcher"
version = "0.1.0"
edition = "2021"
description = "Desktop game process watcher: debounce, grace period, quit-prompt signal, session write"
license = "AGPL-3.0-only"
rust-version = "1.88"

[dependencies]
debrief-journal = { path = "../debrief-journal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

# Process list on desktop. Phone builds do not link this crate.
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "debrief-watcher-probe"
path = "src/bin/probe.rs"
