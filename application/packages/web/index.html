<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: light)" />
    <!-- CSP is set via response header in worker.ts (not a meta tag)
         so Cloudflare can modify it to allow its own injected scripts. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Debrief</title>
    <meta name="description" content="Private notes with a gaming journal. Local folders only — no account, no hosted sync." />
    <meta property="og:title" content="Debrief" />
    <meta property="og:description" content="Private notes with a gaming journal. Local folders only — no account, no hosted sync." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PrivacyNotes: Encrypted Notes, Tasks &amp; Journal" />
    <meta name="twitter:description" content="A private workspace for notes, tasks and your journal. Encrypted on your device. Start free, import your notes, and pay once for Pro." />
    <meta name="twitter:image" content="https://privacynotes.app/og-image.png" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
